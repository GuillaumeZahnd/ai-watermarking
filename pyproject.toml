[project]
name = "ai-watermarking"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "gzahnd", email = "gzahnd@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.14.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.0.0",
    "scipy>=1.18.1",
    "torch>=2.4.0",
    "transformers>=5.16.1",
]

[project.scripts]
ai-watermarking = "ai_watermarking:main"

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
